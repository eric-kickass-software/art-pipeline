<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limner</title>
<link rel="stylesheet" href="/css/limner.css">
</head>
<body>
<header>
  <button id="appMenuBtn" title="Tools">☰</button>
  <h1>Limner<small>icons &amp; portraits</small></h1>
  <span id="tabs"></span>
  <button id="jobsBtn">Queue: idle</button>
</header>
<nav id="appMenu" class="hidden">
  <a href="/workshop" data-app="character">Character Workshop</a>
  <a href="/items" data-app="items">Item Workshop</a>
  <a href="/editor" data-app="editor">Workshop Editor</a>
  <a href="/dungeon" data-app="dungeon">Dungeon Forge</a>
  <a href="/limner" data-app="limner" class="on">Limner <span style="color:var(--muted);font-size:11px">· icons &amp; portraits</span></a>
</nav>
<div id="jobsPanel"><div class="row"><b>Generation queue</b><button id="jobsClear" style="margin-left:auto">Clear finished</button></div><div id="jobsList"></div></div>
<div id="zoom"><img></div>
<div id="err" class="err" style="padding:0 14px"></div>
<div class="layout" id="layout">
  <aside class="side" id="side"></aside>
  <main>
    <div class="tools">
      <label>Show</label><select id="filter"><option value="all">all</option><option value="missing">not approved</option><option value="approved">approved</option><option value="empty">no candidates</option><option value="new">new (to review)</option></select>
      <label><input type="checkbox" id="selAll"> select shown</label>
      <button id="markRev" title="Everything made so far stops counting as new in this category">Mark reviewed</button>
      <span class="hint" title="In the entry panel: left/right = previous/next entry, 1-9 = approve that candidate, Esc closes">keys: ← → 1–9</span>
      <span style="margin-left:auto"></span>
      <button id="addBtn" title="Add your own entry to this category (an item or gear the game doesn't have yet, a UI icon, …)">＋ Add</button>
      <button id="batchBtn" title="Queue a big run (overnight): entries × styles × variations, with retries and a watchdog">Batch…</button>
      <label>Candidates</label><input type="number" id="genN" value="3" min="1" max="12" style="width:52px">
      <button class="primary" id="genSel" title="Queue candidates for every ticked entry">Generate selected</button>
      <button id="genMissing" title="Queue candidates for every entry with no candidates yet">Generate empty</button>
      <span class="hint" id="count"></span>
    </div>
    <div id="addBox" hidden></div>
    <div id="batch" hidden></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="detail" id="detail" hidden></aside>
</div>

<script type="module" src="/js/limner.js"></script>
</body>
</html>
