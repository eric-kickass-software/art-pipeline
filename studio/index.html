<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Studio</title>
<style>
  :root { --bg:#16131c; --panel:#211c29; --line:#352d40; --text:#e8e2ef; --muted:#9a90a8; --accent:#e0b874; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; display:grid;
         grid-template-columns: 290px 1fr 1fr; height:100vh; }
  #panel { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:12px; }
  h1 { font-size:15px; margin:0 0 10px; color:var(--accent); letter-spacing:.5px; }
  h2 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; letter-spacing:1px; }
  .row { display:grid; grid-template-columns: 70px 1fr 18px; gap:6px; align-items:center; margin:3px 0; }
  select, button, input[type=range] { width:100%; }
  select, button { background:#2c2536; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .sw { width:16px; height:16px; border-radius:3px; border:1px solid #0006; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:6px 0; }
  .stage { display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
  .stage label { position:absolute; top:8px; left:12px; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .sub { color:var(--muted); font-size:11px; margin-bottom:2px; }
  #sprite, #spriteBack { image-rendering: pixelated; background: repeating-conic-gradient(#1d1924 0 25%, #221d2a 0 50%) 50%/24px 24px; }
  #vox { width:100%; height:100%; display:block; }
  #err { color:#ff8a7a; white-space:pre-wrap; }
  .slider { display:grid; grid-template-columns: 70px 1fr 36px; gap:6px; align-items:center; margin:3px 0; }
  .slider span { color:var(--muted); text-align:right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="panel">
  <h1>Hearthdelve · Sprite Studio</h1>
  <div class="btns"><a href="/workshop" style="color:var(--accent)">Open Workshop →</a><span></span></div>
  <div class="row"><span>kit set</span><select id="setSel"></select><span></span></div>
  <div class="btns"><button id="rand">Randomize</button><button id="rebuild">Rebuild kit</button></div>
  <div id="err"></div>
  <div class="row"><span>grid</span><select id="res"></select><span></span></div>
  <h2>Body &amp; parts</h2><div id="parts"></div>
  <h2>Colours</h2><div id="colors"></div>
  <h2>Characters</h2>
  <div class="row"><span>name</span><input id="charName" placeholder="e.g. Brennic" style="width:100%;background:#2c2536;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px"><span></span></div>
  <div class="btns"><button id="charSave">Save character</button><span></span></div>
  <div id="charList"></div>
  <h2>Animation</h2>
  <div class="row"><span>view</span><select id="view"></select><span></span></div>
  <div class="row"><span>row</span><select id="rowSel"></select><span></span></div>
  <div class="btns"><button id="play">Pause</button><button id="step">Step frame</button></div>
  <h2>Generate part (FLUX)</h2>
  <div class="row"><span>slot</span><select id="genSlot"></select><span></span></div>
  <div class="row"><span>name</span><input id="genName" placeholder="e.g. coat" style="width:100%;background:#2c2536;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px"><span></span></div>
  <textarea id="genPrompt" rows="3" placeholder="What to add, e.g. a long dark green coat with brass buttons" style="width:100%;margin:4px 0;background:#2c2536;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px"></textarea>
  <div class="row"><span>seed</span><input id="genSeed" type="number" value="5" style="width:100%;background:#2c2536;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px"><span></span></div>
  <div class="btns"><button id="gen">Generate</button><span id="genStatus" style="color:var(--muted);align-self:center"></span></div>
  <h2>Voxel sheet</h2>
  <div id="sliders"></div>
  <div class="btns"><button id="resetCam">Reset camera</button><button id="snap">Save PNG</button></div>
</div>
<div class="stage" style="gap:10px"><label id="spriteLabel">Sprite</label>
  <div style="text-align:center"><div class="sub">front</div><canvas id="sprite"></canvas></div>
  <div style="text-align:center"><div class="sub">back (reverse side of the card)</div><canvas id="spriteBack"></canvas></div></div>
<div class="stage"><label>Voxel sheet (drag to orbit)</label><canvas id="vox"></canvas></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
let meta, app, sheet, img = new Image(), depthImg = new Image(), view = "battle", rowIdx = 0, frame = 0, playing = true;
const S = { thickness: 0.25, relief: 0.25, tiers: 3, keyAngle: 135, keyHeight: 45, keyPower: 2.4, rim: 1.2, ambient: 0.55 };
const SL = [["thickness", 0.05, 5, 0.05], ["relief", 0, 2, 0.05], ["tiers", 1, 6, 1], ["keyAngle", 0, 360, 5],
            ["keyHeight", 5, 85, 1], ["keyPower", 0, 5, 0.1], ["rim", 0, 3, 0.1], ["ambient", 0, 2, 0.05]];

function err(e) { $("err").textContent = e ? String(e) : ""; }

async function getMeta() {
  meta = await (await fetch("/api/meta")).json();
  if (meta.error) return err(meta.error);
  $("view").innerHTML = Object.keys(meta.views).map(v => `<option>${v}</option>`).join("");
  $("view").value = view;
  $("res").innerHTML = meta.resolutions.map(r => `<option value="${r}">${r} × ${r}</option>`).join("");
  $("res").value = meta.res;
  $("genSlot").innerHTML = meta.slots.map(s => `<option>${s.name}</option>`).join("");
}

function randomApp() {
  const r = (a) => a[Math.floor(Math.random() * a.length)];
  const body = r(meta.bodies), parts = {}, colors = {};
  for (const s of meta.slots) {
    const opts = s.parts[body] || [];
    if (!opts.length) continue;
    const chance = { facial: .3, back: .35, offhand: .5, head: .35, hands: .5 }[s.name] ?? .85;
    if (s.required || Math.random() < chance) parts[s.name] = r(opts);
  }
  for (const c of meta.channels) colors[c.name] = r(c.options);
  return { body, parts, colors };
}

function sel(id, label, options, value, onchange, swatch) {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = `<span>${label}</span><select>${options.map(o => `<option value="${o ?? ""}">${o ?? "(none)"}</option>`).join("")}</select>` +
    `<span class="sw" style="background:${swatch ? swatch(value) : "transparent"}; border:${swatch ? "" : "none"}"></span>`;
  const s = d.querySelector("select"); s.value = value ?? "";
  s.onchange = () => { onchange(s.value || null); if (swatch) d.querySelector(".sw").style.background = swatch(s.value); load(); };
  return d;
}

function buildPanel() {
  const P = $("parts"); P.innerHTML = "";
  P.appendChild(sel("body", "build", meta.bodies, app.body, v => { app.body = v; buildPanel(); }));
  for (const s of meta.slots) {
    const opts = s.parts[app.body] || []; if (!opts.length) continue;
    P.appendChild(sel(s.name, s.name, s.required ? opts : [null, ...opts], app.parts[s.name] ?? null,
      v => { if (v) app.parts[s.name] = v; else delete app.parts[s.name]; }));
  }
  const C = $("colors"); C.innerHTML = "";
  for (const c of meta.channels) {
    if (c.options.length < 2) continue;
    C.appendChild(sel(c.name, c.name, c.options, app.colors[c.name] ?? c.default, v => app.colors[c.name] = v, o => c.swatch[o]));
  }
}

const FRONT_DIRS = ["left", "sw"], BACK_DIRS = ["back", "ne"];
function buildRows() {
  const rows = meta.views[view].rows;
  const fronts = rows.map((r, i) => [r, i]).filter(([r]) => FRONT_DIRS.includes(r.dir));
  $("rowSel").innerHTML = fronts.map(([r, i]) => `<option value="${i}">${r.clip}</option>`).join("");
  if (!fronts.some(([, i]) => i === rowIdx)) rowIdx = fronts.length ? fronts[0][1] : 0;
  $("rowSel").value = rowIdx;
}

async function load() {
  err("");
  const res = await (await fetch(`/api/sheet?view=${view}&app=${encodeURIComponent(JSON.stringify(app))}`)).json();
  if (res.error) return err(res.error);
  sheet = res;
  await Promise.all([new Promise(r => { img.onload = r; img.src = res.color; }),
                     new Promise(r => { depthImg.onload = r; depthImg.src = res.depth; })]);
  frame = 0; drawSprite(); buildVoxels();
}

// ------------------------------------------------------------------ 2D sprite
const sc = $("sprite"), sx = sc.getContext("2d");
let SCALE = 6;
const groundRow = (r) => r - Math.max(1, Math.round(3 * r / 64));
function cell() { return sheet.view.cell; }
function curRow() { return sheet.view.rows[rowIdx]; }
function backRow() { const r = curRow(); return sheet.view.rows.find(x => x.clip === r.clip && BACK_DIRS.includes(x.dir)); }
const sb = $("spriteBack"), sbx = sb.getContext("2d");
function drawSprite() {
  if (!sheet) return;
  const [w, h] = cell(), r = curRow(), b = backRow();
  SCALE = Math.max(1, Math.floor(Math.min(384, (window.innerHeight - 120) / 2) / h));
  for (const [cv, ctx, row] of [[sc, sx, r], [sb, sbx, b]]) {
    cv.width = w * SCALE; cv.height = h * SCALE;
    ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, cv.width, cv.height);
    if (row) ctx.drawImage(img, (frame % row.frames) * w, row.row * h, w, h, 0, 0, w * SCALE, h * SCALE);
  }
  $("spriteLabel").textContent = `Sprite ${w}×${h} (×${SCALE})`;
}

// ------------------------------------------------------------------ voxel sheet (three.js)
const vc = $("vox");
const renderer = new THREE.WebGLRenderer({ canvas: vc, antialias: true, preserveDrawingBuffer: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d0b12);
const camera = new THREE.PerspectiveCamera(22, 1, 1, 2000);
const controls = new OrbitControls(camera, vc);
const ambient = new THREE.HemisphereLight(0xcfd4ff, 0x2a2030, S.ambient); scene.add(ambient);
const key = new THREE.DirectionalLight(0xffdcb0, S.keyPower); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005;
Object.assign(key.shadow.camera, { left: -50, right: 50, top: 70, bottom: -10, near: 1, far: 400 });
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x8fb4ff, S.rim); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
let meshes = [];
function resetCam() { camera.position.set(-70, 48, 215); controls.target.set(0, 28, 0); controls.update(); }
resetCam();

function pixels(im) {
  const c = document.createElement("canvas"); c.width = im.width; c.height = im.height;
  const x = c.getContext("2d"); x.drawImage(im, 0, 0); return x.getImageData(0, 0, im.width, im.height).data;
}
let colPx, depPx;
function buildVoxels() {
  if (!sheet) return;
  colPx = pixels(img); depPx = pixels(depthImg); rebuildMesh();
}
function rebuildMesh() {
  if (!colPx) return;
  const [w, h] = cell(), W = img.width;
  for (const m of meshes) { scene.remove(m); m.geometry.dispose(); }
  meshes = [];
  // a double-sided card: front art on the front half of each voxel column, the back art (stored as the
  // reverse side, so mirrored in x) on the back half; relief pushes each side outwards
  const sides = [[curRow(), 1, false], [backRow(), -1, true]];
  const half = S.thickness / 2, u = 64 / w;
  for (const [row, sign, mirrorX] of sides) {
    if (!row) continue;
    const ox = (frame % row.frames) * w, oy = row.row * h, list = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = ((oy + y) * W + ox + x) * 4;
      if (colPx[i + 3] < 128) continue;
      const tier = S.tiers - Math.round(depPx[i] / 255 * S.tiers);
      list.push([mirrorX ? w - 1 - x : x, y, tier, colPx[i], colPx[i + 1], colPx[i + 2]]);
    }
    const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, half), new THREE.MeshStandardMaterial({ roughness: 0.6 }), list.length);
    mesh.castShadow = mesh.receiveShadow = true;
    const m = new THREE.Matrix4(), c = new THREE.Color();
    list.forEach(([x, y, t, R, G, B], k) => {
      m.makeScale(u, u, u);
      m.setPosition((x - w / 2 + 0.5) * u, (groundRow(h) - y - 0.5) * u, sign * (t * S.relief + half / 2) * u);
      mesh.setMatrixAt(k, m);
      mesh.setColorAt(k, c.setRGB(R / 255, G / 255, B / 255, THREE.SRGBColorSpace));
    });
    scene.add(mesh); meshes.push(mesh);
  }
}
function applyLights() {
  const a = THREE.MathUtils.degToRad(S.keyAngle), e = THREE.MathUtils.degToRad(S.keyHeight);
  key.position.set(Math.cos(a) * Math.cos(e) * 120, 30 + Math.sin(e) * 120, 60 + Math.sin(a) * Math.cos(e) * 40);
  key.target.position.set(0, 30, 0); key.intensity = S.keyPower;
  rim.position.set(80, 60, -90); rim.intensity = S.rim; ambient.intensity = S.ambient;
}
function buildSliders() {
  const box = $("sliders");
  for (const [k, lo, hi, st] of SL) {
    const d = document.createElement("div"); d.className = "slider";
    d.innerHTML = `<span style="text-align:left">${k}</span><input type="range" min="${lo}" max="${hi}" step="${st}" value="${S[k]}"><span>${S[k]}</span>`;
    const inp = d.querySelector("input");
    inp.oninput = () => { S[k] = +inp.value; d.lastChild.textContent = S[k];
      if (["thickness", "relief", "tiers"].includes(k)) rebuildMesh(); applyLights(); };
    box.appendChild(d);
  }
}
function resize() {
  const r = vc.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

// ------------------------------------------------------------------ loop + wiring
let last = 0;
function tick(t) {
  requestAnimationFrame(tick);
  if (sheet && playing && t - last > 1000 / (curRow().fps || 6)) {
    last = t; frame = (frame + 1) % curRow().frames; drawSprite(); rebuildMesh();
  }
  controls.update(); renderer.render(scene, camera);
}
async function loadChars() {
  const r = await (await fetch("/api/characters")).json();
  $("setSel").innerHTML = `<option value="">(all parts)</option>` + r.sets.map(s => `<option>${s.name}</option>`).join("");
  $("setSel").value = r.set || "";
  $("charList").innerHTML = r.characters.map(c => `<div class="row" style="grid-template-columns:1fr 50px 22px">
    <span title="${c.saved}">${c.name} <span style="color:var(--muted)">(${c.appearance.body})</span></span>
    <button data-load="${c.name}">Load</button><button data-del="${c.name}" title="delete">×</button></div>`).join("");
  document.querySelectorAll("[data-load]").forEach(b => b.onclick = () => {
    const c = r.characters.find(x => x.name === b.dataset.load); app = JSON.parse(JSON.stringify(c.appearance));
    $("charName").value = c.name; buildPanel(); load(); });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await fetch("/api/characters/delete", { method: "POST", body: JSON.stringify({ name: b.dataset.del }) }); loadChars(); });
}
$("charSave").onclick = async () => {
  const name = $("charName").value.trim(); if (!name) return err("Name the character first.");
  const r = await (await fetch("/api/characters/save", { method: "POST", body: JSON.stringify({ name, appearance: app }) })).json();
  if (r.error) return err(r.error); loadChars();
};
$("setSel").onchange = async () => {
  err("Switching kit set…");
  const r = await (await fetch("/api/set/use", { method: "POST", body: JSON.stringify({ name: $("setSel").value }) })).json();
  if (r.error) return err(r.error); err(""); await getMeta(); app = randomApp(); buildPanel(); buildRows(); load();
};
$("rand").onclick = () => { app = randomApp(); buildPanel(); load(); };
$("rebuild").onclick = async () => {
  $("rebuild").textContent = "Rebuilding…";
  const r = await (await fetch("/api/rebuild", { method: "POST" })).json();
  $("rebuild").textContent = "Rebuild kit"; if (r.error) return err(r.error);
  await getMeta(); buildPanel(); buildRows(); load();
};
$("res").onchange = async () => {
  err("Switching grid… (first time at a resolution bakes the kit)");
  const r = await (await fetch(`/api/resolution?res=${$("res").value}`, { method: "POST" })).json();
  if (r.error) return err(r.error);
  err(""); await getMeta(); buildPanel(); buildRows(); load();
};
$("gen").onclick = async () => {
  const slot = $("genSlot").value, name = $("genName").value.trim().replace(/\s+/g, "_").toLowerCase();
  const prompt = $("genPrompt").value.trim();
  if (!name || !prompt) return err("Give the part a name and a prompt.");
  $("gen").disabled = true; $("genStatus").textContent = "generating front + back…";
  const r = await (await fetch("/api/generate", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ part: `${slot}.${name}`, prompt, body: app.body, seed: +$("genSeed").value }) })).json();
  $("gen").disabled = false; $("genStatus").textContent = r.error ? "failed" : "done";
  if (r.error) return err(r.error);
  await getMeta(); app.parts[slot] = `${slot}.${name}`; buildPanel(); buildRows(); load();
};
$("view").onchange = () => { view = $("view").value; rowIdx = 0; buildRows(); load(); };
$("rowSel").onchange = () => { rowIdx = +$("rowSel").value; frame = 0; drawSprite(); rebuildMesh(); };
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; };
$("step").onclick = () => { frame = (frame + 1) % curRow().frames; drawSprite(); rebuildMesh(); };
$("resetCam").onclick = resetCam;
$("snap").onclick = () => { const a = document.createElement("a"); a.download = "voxel_sheet.png"; a.href = vc.toDataURL(); a.click(); };

await getMeta(); app = randomApp(); buildPanel(); buildRows(); buildSliders(); applyLights(); resize(); load(); loadChars();
requestAnimationFrame(tick);
</script>
</body>
</html>
