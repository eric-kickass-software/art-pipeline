[project]
name = "hdart"
version = "0.1.0"
description = "Hearthdelve art pipeline: ComfyUI textures/icons, TRELLIS.2 meshes, Blender renders, paper-doll compositing"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "requests>=2.32",
    "websocket-client>=1.8",
]

[project.scripts]
hdart = "hdart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hdart"]
